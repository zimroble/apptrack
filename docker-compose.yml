services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apptrack
      POSTGRES_PASSWORD: apptrack
      POSTGRES_DB: apptrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptrack"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://apptrack:apptrack@db:5432/apptrack
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
