name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apptrack
          POSTGRES_PASSWORD: apptrack
          POSTGRES_DB: apptrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apptrack" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://apptrack:apptrack@localhost:5432/apptrack_test
      E2E_DATABASE_URL: postgresql://apptrack:apptrack@localhost:5432/apptrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apptrack .
